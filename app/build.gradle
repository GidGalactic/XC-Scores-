plugins { id 'com.android.application' }
android {
 namespace 'com.gidgalactic.xcscores'
 compileSdk 35
 signingConfigs {
  release {
   // Only supplied by GitHub Actions secrets; never commit a signing key.
   if (System.getenv('XC_KEYSTORE_PATH')) {
    storeFile file(System.getenv('XC_KEYSTORE_PATH'))
    storePassword System.getenv('XC_KEYSTORE_PASSWORD')
    keyAlias System.getenv('XC_KEY_ALIAS')
    keyPassword System.getenv('XC_KEY_PASSWORD')
   }
  }
 }
 defaultConfig { applicationId 'com.gidgalactic.xcscores'; minSdk 26; targetSdk 35; versionCode 4; versionName '1.3' }
 buildTypes {
  release {
   minifyEnabled false
   if (System.getenv('XC_KEYSTORE_PATH')) signingConfig signingConfigs.release
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.work:work-runtime:2.9.1' }
